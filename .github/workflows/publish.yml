# Publishes to npm when a GitHub release is published, or when release.yml
# dispatches it. A release created by release.yml uses the workflow
# GITHUB_TOKEN, which does not fire `release` events, so release.yml runs this
# workflow directly with `tag` and `prerelease` inputs. Do not rename this
# file: the npm trusted publisher is configured for it by name.
#
# Authentication is npm trusted publishing (OIDC) — there is deliberately no
# NPM_TOKEN. The registry verifies a short-lived, workflow-scoped OIDC token
# instead of a stored credential, so there is nothing to leak or rotate.
#
# This requires a trusted publisher configured on npmjs.com for the `brignano`
# package, pointing at this repository and this workflow filename. Without it,
# the publish step fails with an authentication error.

name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, like v1.2.3
        required: true
        type: string
      prerelease:
        description: Publish to the `next` dist-tag
        required: false
        default: false
        type: boolean
  release:
    # `created` never fires for draft releases, and does not fire when a release
    # is published from a previously-saved draft — so the usual "save a draft,
    # write the notes, hit Publish" flow silently skipped the npm publish.
    # `published` covers both publishing directly and publishing from a draft.
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for publish rights. Also what
      # provenance is derived from, so the attestation still names this repo,
      # commit and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.x.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      # A tag that disagrees with package.json publishes a version nobody can
      # find by tag, and npm versions are immutable, so catch it here.
      #
      # A dispatch from release.yml has no version-bump commit: the tag is the
      # source of truth and package.json is rewritten in the runner (the
      # runtime `--version` reads package.json, so it reports the tag too).
      # A release published from the UI must still match package.json.
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          tag="${TAG#v}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a version like v1.2.3"; exit 1; }
          if [ "$DISPATCHED" = "true" ]; then
            npm version "$tag" --no-git-tag-version --allow-same-version
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi
          echo "publishing ${pkg}"
      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Lint
        run: npm run lint
      - name: Test (non-interactive)
        run: npm test
        env:
          CI: true
      - name: Publish to npm
        # No NODE_AUTH_TOKEN: auth comes from the OIDC token minted above.
        #
        # Pre-releases ship under the `next` dist-tag — otherwise a pre-release
        # would become the version `npx brignano` resolves to. A UI release
        # carries the flag on the event; a dispatched run gets it as an input.
        env:
          PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then npm publish --tag next; else npm publish; fi
